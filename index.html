<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Библиотека Ранобэ</title>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: #e0e0e0; padding: 20px; }
        h1 { color: #fff; }
        ul { list-style: none; padding: 0; }
        li { background-color: #1e1e1e; margin-bottom: 10px; padding: 15px; border-radius: 8px; }
        a { color: #4CAF50; text-decoration: none; font-size: 18px; font-weight: bold; display: block; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Оглавление</h1>
    <ul id="toc"></ul>

    <script>
        const tocList = document.getElementById('toc');

        for (let i = 248; i <= 300; i++) {
            const li = document.createElement('li');
            const a = document.createElement('a');

            a.href = `TableOfContents/chapter${i}.html`;
            a.innerText = `Глава ${i}`;

            li.appendChild(a);
            tocList.appendChild(li);
        }
    </script>
</body>
</html>
